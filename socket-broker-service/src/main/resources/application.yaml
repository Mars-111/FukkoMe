

spring:
  application:
    name: socket-broker-service
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://id.mars-ssn.ru/.well-known/jwks.json
  data:
    redis:
      host: localhost
      port: 6379
      ssl:
        enabled: false

  kafka:
    listener:
      concurrency: 3
      ack-mode: manual_immediate
    bootstrap-servers: localhost:29092,localhost:39092,localhost:49092
    producer:
      retries: 3
      acks: all
      properties:
        linger.ms: 1
    consumer:
      group-id: "socket-broker-1"
      auto-offset-reset: latest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    properties:
      security.protocol: PLAINTEXT


server:
  port: 8081
  ssl:
    key-store: classpath:keystore.p12
    key-store-password: Mars123asd!
    key-store-type: PKCS12
    key-alias: mars-ssn
  id: "ws-server-1"

logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.data.redis: DEBUG
    ru.kors.socketbrokerservice.services.SessionManager: DEBUG
debug: true

websocket:
  heartbeat:
    inactivity-timeout: 15000
    interval: 10000