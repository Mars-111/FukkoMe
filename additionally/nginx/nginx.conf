worker_processes 5;

events {
    worker_connections 1024;
}

http {
    # Увеличиваем размер для хэширования имен серверов
    server_names_hash_bucket_size 128;

    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name mars-ssn.ru www.mars-ssn.ru socket.mars-ssn.ru www.socket.mars-ssn.ru;

        # Автоматический редирект на HTTPS
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name mars-ssn.ru www.mars-ssn.ru;

        # SSL-сертификаты Cloudflare
        ssl_certificate C:\develop\School-Social-Network\certs\cert.pem;
        ssl_certificate_key C:\develop\School-Social-Network\certs\key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # Фронтенд (React/Vite)
        location / {
            proxy_pass https://109.228.70.130:5173;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # HMR (WebSocket) — ключевые заголовки
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_cache_bypass $http_upgrade;
        }

        location /ws {
            proxy_pass http://109.228.70.130:8081;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
        }

        location /wss {
            proxy_pass http://109.228.70.130:8081;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
        }

    }

    server {
        listen 443 ssl;
        server_name socket.mars-ssn.ru;

        # SSL-сертификаты
        ssl_certificate C:\develop\School-Social-Network\certs\cert.pem;
        ssl_certificate_key C:\develop\School-Social-Network\certs\key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # Прокси для WebSocket
        location /ws {
            proxy_pass https://109.228.70.130:8081; # Используем ws:// или wss://
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Отключаем кеширование
            proxy_cache_bypass $http_upgrade;

            # Если используется SSL на бэкенде
            proxy_ssl_verify off;
        }
    }

    server {
        listen 443 ssl;
        server_name chats.mars-ssn.ru www.chats.mars-ssn.ru;

        # SSL-сертификаты Cloudflare
        ssl_certificate C:\develop\School-Social-Network\certs\cert.pem;
        ssl_certificate_key C:\develop\School-Social-Network\certs\key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # API-бэкенд (Spring)
        location / {
            proxy_pass https://109.228.70.130:8082;  # Spring backend
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    server {
        listen 443 ssl;
        server_name keycloak.mars-ssn.ru www.keycloak.mars-ssn.ru;

        # SSL-сертификаты Cloudflare
        ssl_certificate C:\develop\School-Social-Network\certs\cert.pem;
        ssl_certificate_key C:\develop\School-Social-Network\certs\key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # API-бэкенд (Spring)
        location / {
            proxy_pass https://109.228.70.130:8443;  
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    server {
        listen 443 ssl;
        server_name id.mars-ssn.ru www.id.mars-ssn.ru;

        # SSL-сертификаты Cloudflare
        ssl_certificate C:\develop\School-Social-Network\certs\cert.pem;
        ssl_certificate_key C:\develop\School-Social-Network\certs\key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # API-бэкенд (Spring)
        location / {
            proxy_pass https://109.228.70.130:8090;  
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    server {
        listen 443 ssl;
        server_name file.mars-ssn.ru www.file.mars-ssn.ru;
        # SSL-сертификаты Cloudflare
        ssl_certificate C:\develop\School-Social-Network\certs\cert.pem;
        ssl_certificate_key C:\develop\School-Social-Network\certs\key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # API-бэкенд (Spring)
        location / {
            proxy_pass https://109.228.70.130:8083;  # Spring backend
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

    }
}
